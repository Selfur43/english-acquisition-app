publish_to: "none"
version: 0.9.1+61

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
