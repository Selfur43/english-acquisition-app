
name: english_acquisition_app
description: Private two-user English acquisition application for Windows-first validation.
publish_to: "none"
version: 0.10.0+70

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  sqlite3: ^3.8.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.2.18
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter_test
  flutter_lints: ^6.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.8v

flutter:
  uses-material-design: true

dependency_overrides:
  path_provider_android: 2.2.23

